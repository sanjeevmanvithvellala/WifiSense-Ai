version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: wifisense-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=sqlite:////app/backend/data/wifisense.db
      - ARTIFACTS_DIR=/app/backend/artifacts
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:5173","http://localhost:80"]
    volumes:
      - backend_data:/app/backend/data
      - backend_artifacts:/app/backend/artifacts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: wifisense-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_data:
  backend_artifacts:
